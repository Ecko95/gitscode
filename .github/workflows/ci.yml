name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    # 30m headroom so a cold run (no warm Bun/Turbo/Playwright caches) can finish
    # and seed the caches even if the browser download needs a few retries; warm
    # runs land well under it. See the browser-install step for the retry rationale.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: |
          if ! node -e "require('./apps/desktop/node_modules/electron')" >/dev/null 2>&1; then
            rm -rf apps/desktop/node_modules/electron/dist apps/desktop/node_modules/electron/path.txt
            bun apps/desktop/node_modules/electron/install.js
          fi
          node -e "require('./apps/desktop/node_modules/electron')"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install browser test runtime
        # cdn.playwright.dev (a 307-redirector to Google's chrome-for-testing GCS
        # bucket) stalls intermittently from the hosted runner, and playwright never
        # times out a stalled-but-open connection, so its own installer hangs until
        # the cap. Fetch the browser zips ourselves with curl (retry + stall-abort
        # via --speed-time), pulling the Chrome-for-Testing artifacts straight from
        # GCS, into playwright's cache layout; then `playwright install` is a no-op
        # that just validates. Version-proof: locations + urls come from --dry-run.
        # Cacheable, so warm runs skip the fetch entirely.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd apps/web
          PW="node node_modules/playwright/cli.js"
          plan="$(mktemp)"
          $PW install --dry-run chromium \
            | awk '/Install location:/{loc=$3} /Download url:/&&loc!=""{print loc"\t"$3;loc=""}' \
            | sort -u > "$plan"
          while IFS=$'\t' read -r loc url; do
            if [ -f "$loc/INSTALLATION_COMPLETE" ]; then
              echo "cached: $loc"
              continue
            fi
            case "$url" in
              *cdn.playwright.dev/builds/cft/*)
                url="https://storage.googleapis.com/chrome-for-testing-public/${url#*cdn.playwright.dev/builds/cft/}" ;;
            esac
            echo "::group::fetch $loc"
            echo "$url"
            mkdir -p "$loc"
            tmp="$(mktemp --suffix=.zip)"
            curl -fSL --retry 8 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --speed-limit 1024 --speed-time 20 \
                 -o "$tmp" "$url"
            unzip -q -o "$tmp" -d "$loc"
            rm -f "$tmp"
            : > "$loc/INSTALLATION_COMPLETE"
            : > "$loc/DEPENDENCIES_VALIDATED"
            echo "::endgroup::"
          done < "$plan"
          # Validate: a no-op when the prefetch is complete, otherwise fills any gap.
          $PW install chromium

      - name: Browser test
        run: bun run --cwd apps/web test:browser

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: node scripts/mobile-native-static-check.ts

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
